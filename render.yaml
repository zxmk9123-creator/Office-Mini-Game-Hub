# Render Blueprint — provisions all three services this app needs:
#   1. mini-game-hub-db   Render PostgreSQL
#   2. mini-game-hub-api  Express API (Render web service, Node runtime)
#   3. mini-game-hub-web  React app (Render static site)
#
# This is a starting point, not a black box — validate field names against
# Render's current Blueprint spec (https://render.com/docs/blueprint-spec)
# if the dashboard rejects anything; the schema does evolve.
#
# Two env vars are intentionally left for manual entry (`sync: false`)
# because their real values don't exist until the *other* service has
# been deployed once and has a real onrender.com URL:
#   - mini-game-hub-api's CORS_ORIGIN      -> the web service's URL
#   - mini-game-hub-web's VITE_API_BASE_URL -> the api service's URL
# See README.md "Render deployment" for the exact order to set these in.

databases:
  - name: mini-game-hub-db
    databaseName: mini_game_hub
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: mini-game-hub-api
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build --workspace=apps/server
    startCommand: npm run start --workspace=apps/server
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mini-game-hub-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: CORS_ORIGIN
        sync: false # set to the deployed web service's URL, e.g. https://mini-game-hub-web.onrender.com

  - type: web
    name: mini-game-hub-web
    env: static
    rootDir: .
    buildCommand: npm install && npm run build --workspace=apps/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # set to the deployed api service's URL, e.g. https://mini-game-hub-api.onrender.com — then trigger a rebuild (Vite bakes this in at build time)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
